[project]
name = "deals-hunter"
version = "1.0.0"
description = "Cross-platform Deal & Promotion Monitor with Desktop Notifications, System Tray/Bar Gadgets & Optional Telegram Bot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.1",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
]

[project.scripts]
deals-hunter = "main:main"
